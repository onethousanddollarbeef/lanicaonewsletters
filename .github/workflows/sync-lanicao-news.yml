name: Sync Lani Cao news briefs

# Keeps news-feed.json on gh-pages in step with the posts published on
# https://www.lanicao.com/news, which drives the homepage "Rapid briefs" section.
# Scheduled workflows only run from the default branch, so this file lives on
# main while the data file it writes lives on gh-pages.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lanicao-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sync script
        uses: actions/checkout@v4

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild news-feed.json
        run: node scripts/sync-lanicao-news.mjs site/news-feed.json

      - name: Publish changes
        working-directory: site
        run: |
          if git diff --quiet -- news-feed.json; then
            echo "No news changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-feed.json
          git commit -m "Update news briefs from lanicao.com"
          git push
